# Install this file on the VPS as:
#   /etc/nginx/sites-available/diaweb-copywriting.conf
# Then symlink it into:
#   /etc/nginx/sites-enabled/diaweb-copywriting.conf

upstream diaweb_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name cabinet.diaverse.app;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cabinet.diaverse.app;

    # Replace with the real certificate paths provisioned on the VPS.
    ssl_certificate /etc/letsencrypt/live/cabinet.diaverse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabinet.diaverse.app/privkey.pem;

    access_log /var/log/nginx/diaweb.access.log;
    error_log /var/log/nginx/diaweb.error.log warn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://diaweb_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
